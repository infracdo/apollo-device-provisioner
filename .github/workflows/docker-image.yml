name: Build and Push Docker Image

on:
  push:
    branches:
      - apd-dev # Trigger on pushes to the main branch

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Add DOCKER_USERNAME secret in GitHub
          password: ${{ secrets.DOCKER_PASSWORD }} # Add DOCKER_PASSWORD secret in GitHub

      # Step 3: Build the Docker image
      - name: Build Docker Image
        run: 
          # docker build --target build -t my-image:build .

          docker build -t hive-ais-apollo-device-provisioner:dev-0.1 .

      - name: Clean Up Docker Garbage
        run: |
          sudo docker system prune -f
          sudo docker builder prune -f

      # Step 4: Push the Docker image
      - name: Push Docker Image
        run: |
          docker tag hive-ais-apollo-device-provisioner:dev-0.1 infracdo/hive-ais-apollo-device-provisioner:dev-0.1
          docker push infracdo/hive-ais-apollo-device-provisioner:dev-0.1
